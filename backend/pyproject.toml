[project]
name = "maf-multi-agent"
version = "0.1.0"
description = "MAF-based multi-agent orchestration app with Foundry, Fabric MCP, and scratchpad collaboration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "azure-identity>=1.19.0",
    "aiohttp>=3.9.0",
    "openai>=1.99.0",
    "agent-framework-core @ git+https://github.com/microsoft/agent-framework.git@d74d26c917a98d23f7e537429885ca51724cf74a#subdirectory=python/packages/core",
    "agent-framework-openai @ git+https://github.com/microsoft/agent-framework.git@d74d26c917a98d23f7e537429885ca51724cf74a#subdirectory=python/packages/openai",
    "agent-framework-foundry @ git+https://github.com/microsoft/agent-framework.git@d74d26c917a98d23f7e537429885ca51724cf74a#subdirectory=python/packages/foundry",
    "azure-ai-projects>=2.1.0",
    "azure-ai-agents>=1.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "httpx>=0.27.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "azure-storage-blob>=12.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
